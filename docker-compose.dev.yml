# Local dependencies for development. Run the API and web app on the host.
name: open-email-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openemail
      POSTGRES_PASSWORD: openemail
      POSTGRES_DB: openemail
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: openemail
      MINIO_ROOT_PASSWORD: openemail-dev
    ports: ["9000:9000", "9001:9001"]
