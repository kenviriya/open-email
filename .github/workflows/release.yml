name: release

# Attaches install.sh, pinned to the release tag, so this works:
#   curl -fsSL https://github.com/kenviriya/open-email/releases/latest/download/install.sh | bash
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin version and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          sed -i "s/@VERSION@/$TAG/" install.sh
          grep -q "OPEN_EMAIL_VERSION:-$TAG" install.sh
          gh release upload "$TAG" install.sh --clobber
